name: Test no issue context error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no issue in workflow_dispatch context)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          message: "This issue has been closed."
        continue-on-error: true

      - name: Assert action failed due to missing issue context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no issue is in context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no issue/PR found in context"
