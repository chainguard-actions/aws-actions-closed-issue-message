name: Test basic issue closed comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "issue": {
              "number": 42,
              "title": "Test Issue"
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: issues
          GITHUB_EVENT_PATH: /tmp/github-event/event.json
          GITHUB_REPOSITORY: test-owner/test-repo
        with:
          repo-token: fake-token-for-testing
          message: "This issue has been closed. Thank you for your contribution!"

      - name: Assert action ran (failed at API call, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the GitHub API call (bad token),
          # not at input validation. Either 'failure' (API error) or
          # 'success' (if somehow the API call worked) is acceptable.
          # What we do NOT want is the action to fail before even reaching
          # the API call (e.g., missing inputs).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
