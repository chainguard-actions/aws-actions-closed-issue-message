name: Test missing required repo-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without repo-token input (expect failure)
        id: action
        uses: .
        with:
          # repo-token intentionally omitted to test required input validation
          message: "This issue has been closed."
        continue-on-error: true

      - name: Assert action failed due to missing repo-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required 'repo-token' input is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'repo-token' input is missing"
